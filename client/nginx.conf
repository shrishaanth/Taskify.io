# nginx is both the static host for the compiled frontend and the load
# balancer in front of the stateless app server pool.

# The app pool. Scale by adding entries (docker-compose service replicas
# resolve via these hostnames).
#
# ip_hash = sticky sessions, REQUIRED for Socket.IO: its handshake spans
# several HTTP requests that must land on the same instance. Cross-instance
# events still reach everyone through the Redis adapter.
upstream taskify_api {
    ip_hash;
    server api-1:5000;
    server api-2:5000;
}

server {
    listen 80;
    server_name _;

    # Compiled frontend build
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed assets, never cache the HTML shell
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # REST API -> app pool
    location /api/ {
        proxy_pass http://taskify_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO: same pool, plus the websocket upgrade headers
    location /socket.io/ {
        proxy_pass http://taskify_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Websockets are long-lived — don't let nginx kill idle ones
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: any other path is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }
}

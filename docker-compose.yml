# Full scaled deployment of the architecture diagram:
#
#   browser ──> nginx (static frontend + load balancer)
#                 ├──> api-1 ─┐   stateless Node/Express + Socket.IO pool
#                 └──> api-2 ─┤
#                             ├──> mongo  (data)
#                             └──> redis  (socket adapter, cache, presence, job locks)
#
#   docker compose up --build
#   open http://localhost:8080
#
# Prove the real-time sync: open two browsers (admin + member), drag a task —
# it moves in both. Prove the load balancing: curl http://localhost:8080/api/health
# from different source IPs and watch "instance" change.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-1:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: mongodb://mongo:27017/taskify
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      INSTANCE_ID: api-1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-2:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: mongodb://mongo:27017/taskify
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      INSTANCE_ID: api-2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-1
      - api-2

volumes:
  mongo-data:

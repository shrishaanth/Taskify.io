worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ---------------------------------------------------------------------------
  # App server pool. `ip_hash` gives sticky sessions so a client's Socket.IO
  # handshake and its follow-up polling/upgrade land on the same instance.
  # (Cross-instance broadcast would need @socket.io/redis-adapter — out of
  # scope here; each client only needs events from the instance it is pinned
  # to, and REST is stateless so any instance can serve it.)
  # ---------------------------------------------------------------------------
  upstream taskify_app {
    ip_hash;
    server app1:4000;
    server app2:4000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # WebSocket / Socket.IO transport.
    location /socket.io/ {
      proxy_pass         http://taskify_app;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # REST API (includes the auth cookie routes under /api/v1/auth).
    location /api/ {
      proxy_pass       http://taskify_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — everything else falls back to the client bundle.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
